<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Damascus Reign</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="crt-overlay"></div>
  <div id="vignette"></div>

  <div id="game-container">
    <aside id="stats-panel" class="panel side-panel">
      <div class="panel-header">Chronicle</div>
      <div id="stats-content"></div>
    </aside>

    <main id="main-terminal" class="panel">
      <div id="location-header">SYSTEM BOOT</div>
      <div id="output"></div>
      <div class="input-area">
        <span class="prompt" id="prompt">Reign:&gt;</span>
        <input type="text" id="cmd-input" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
      </div>
    </main>

    <aside id="help-panel" class="panel side-panel">
      <div class="panel-header">Codex</div>
      <div id="help-content"></div>
    </aside>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
